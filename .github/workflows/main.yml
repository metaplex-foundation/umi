name: Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_fix:
    name: Fix styling
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
    - name: Git checkout
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Fix format
      run: pnpm run format:fix

    - name: Fix linting
      run: pnpm run lint:fix

    - name: Commit potential changes
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: Fix styling

  lint:
    name: Check styling
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: Git checkout
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check format
      run: pnpm run format

    - name: Check linting
      run: pnpm run lint

  tests:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18.x", "20.x"]
        solana: ["1.17.34"]

    steps:
    - name: Git checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Solana
      uses: ./.github/actions/install-solana
      with:
        solana_version: ${{ matrix.solana }}

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Start local validator using Amman
      run: pnpm validator

    - name: Build and run tests
      run: pnpm test

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [lint, tests]
    # Publishes to npm with OIDC trusted publishing: `id-token: write` lets the
    # job mint a token that npm exchanges for a short-lived publish credential,
    # so there is no long-lived NPM_TOKEN to expire. Every published package
    # must list this repo and workflow as a trusted publisher on npmjs.com.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # `changeset publish` runs `pnpm publish`, which hands the actual publish
      # and the OIDC exchange to the npm CLI; trusted publishing needs npm 11.5.1+.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@11.19.1
          npm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Build Version
        run: |
          pnpm packages:version
          echo "BUILD_VERSION=$(./configs/get-latest-version.sh)" | tee $GITHUB_ENV
          git reset --hard && git clean -df
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "Release packages"
          title: "Release packages"
          publish: pnpm packages:publish
          # One aggregate release per version is created below instead of one per package.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN on purpose: without it the action uses OIDC trusted publishing.

      - name: Create GitHub release
        if: steps.changesets.outputs.published == 'true'
        run: gh release create "v${BUILD_VERSION}" --title "v${BUILD_VERSION}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy_docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    environment:
      name: js-documentation
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: echo "url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})" | tee $GITHUB_OUTPUT
